[project]
name = "cloudshield"
version = "0.1.0"
description = "CloudShield Detection Engineering Framework"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest",
]
