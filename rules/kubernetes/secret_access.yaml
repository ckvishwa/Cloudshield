rule_id: K8S-SECRET-001
title: Kubernetes Secret Access
severity: HIGH
source: kubernetes_audit
event_type: k8s.secret.access
description: >-
  A principal read (get), enumerated (list) or watched Kubernetes Secrets, in a
  request that succeeded or whose outcome is unknown. The severity is HIGH for
  all three access types because each returns Secret contents to the caller: a
  get returns one Secret, and list and watch return every Secret they cover.
  This does not mean a secret was stolen or exfiltrated, and routine controllers
  also read Secrets, so expect noise from system identities. Create, update and
  delete are different events and are not matched. No Secret data, stringData or
  request/response bodies are ever retained; only the access type, namespace,
  Secret name and caller facts are kept. Visibility depends on the audit policy
  recording Secret access.
# T1552.007 (Unsecured Credentials: Container API): credentials are obtained
# through the Kubernetes API.
mitre_attack: T1552.007
conditions:
  - field: attributes.secret_access_type
    operator: in
    value:
      - read
      - enumeration
      - watch
