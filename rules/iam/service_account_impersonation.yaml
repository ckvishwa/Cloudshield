rule_id: GCP-IAM-002
title: Suspicious Service Account Credential Generation
severity: HIGH
source: gcp_audit
event_type: gcp.iam.service_account_credential_generation
description: >-
  Detects short-lived credential generation (access token, ID token, signed
  JWT, signed blob) for a protected service account by a principal that is not
  on the approved caller list. Self-use of a service account's own identity is
  excluded by the normalizer (attributes.self_impersonation). Lab values below
  are examples; replace them with the environment's protected accounts and
  approved callers.
# T1550 (Use Alternate Authentication Material): the caller obtains a
# short-lived credential for another identity and acts as that identity.
# Cloud-specific sub-technique T1550.001 covers application access tokens
# and is the closest fit, but T1550 is kept until impersonation semantics
# are validated against real logs.
mitre_attack: T1550
conditions:
  - field: attributes.target_service_account
    operator: in
    value:
      - prod-admin@cloudshield-lab.iam.gserviceaccount.com
      - deployment-admin@cloudshield-lab.iam.gserviceaccount.com
  - field: principal
    operator: not_in
    value:
      - ci-deployer@cloudshield-lab.iam.gserviceaccount.com
  - field: attributes.self_impersonation
    operator: equals
    value: false
