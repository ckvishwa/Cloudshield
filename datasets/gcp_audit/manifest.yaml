dataset: gcp_audit
schema_version: 1
description: >-
  Labeled GCP Cloud Audit Log corpus for offline replay of the CloudShield
  detections. Provenance and expected labels live in the corpus envelope,
  never inside the raw telemetry.
corpus_file: corpus.jsonl
fictional_project: cloudshield-lab
rules_covered:
  - GCP-IAM-001
  - GCP-IAM-002
# Must match the corpus exactly; loading fails on drift.
event_counts:
  official_example: 8
  public_sanitized_example: 0
  synthetic_variant: 27
  total: 35
notes:
  - No public_sanitized_example events are included; none were found that could be reused with clear provenance.
  - Synthetic variants are authored for CloudShield and are not real telemetry.
  - One event (syn-iam001-gap-owner-without-deltas) is a documented false negative; see README.md.
